apiVersion: score.dev/v1b1
metadata:
  name: livekit
boatyard:
  lock:
    livekit: LIVEKIT_SERVER_IMAGE
  # The published ports the consumer's override document materializes on the shared
  # network: signaling tcp plus the RTC udp range.
  publish:
    - published: 6178
      target: 6178
      protocol: tcp
    - published: 5957
      target: 5957
      protocol: udp
containers:
  livekit:
    variables:
      LIVEKIT_KEYS: ${resources.livekit-config.api_keys}
      LIVEKIT_CONFIG: ${resources.livekit-config.config}
resources:
  livekit-config:
    type: livekit-config
