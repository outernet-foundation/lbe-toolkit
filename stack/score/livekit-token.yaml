apiVersion: score.dev/v1b1
metadata:
  name: livekit-token
  annotations:
    # The route the consumer's gateway mounts.
    boatyard/route: /livekit-token/*=livekit-token:8000
    boatyard/dockerfile: livekit-token=workloads/livekit-token/Dockerfile
    boatyard/probe-adapter: python-urllib
containers:
  livekit-token:
    livenessProbe:
      httpGet:
        path: /livekit-token/health
        port: 8000
    readinessProbe:
      httpGet:
        path: /livekit-token/health
        port: 8000
    variables:
      LIVEKIT_API_KEY: ${resources.livekit-config.api_key}
      LIVEKIT_API_SECRET: ${resources.livekit-config.api_secret}
      LIVEKIT_SERVER_URL: ${resources.livekit-config.server_url}
      DEPLOYMENT_ENVIRONMENT: ${resources.livekit-config.deployment_environment}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${resources.livekit-config.otel_endpoint}
resources:
  livekit-config:
    type: livekit-config
