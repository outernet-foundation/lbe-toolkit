LIVEKIT_API_KEY:
  description: LiveKit API key credential.
  mint: true
LIVEKIT_API_SECRET:
  description: LiveKit API secret credential.
  mint: true
LIVEKIT_SIGNALING_IP: External IP LiveKit advertises for signaling.
LIVEKIT_SIGNALING_PORT: LiveKit signaling (TCP) port.
LIVEKIT_RTC_PORT: LiveKit RTC (UDP) port.
LIVEKIT_RTC_IP: External IP LiveKit advertises for RTC.
DEPLOYMENT_ENVIRONMENT: Deployment environment label (defaults to development).
OTEL_EXPORTER_OTLP_ENDPOINT: OTLP exporter endpoint (defaults to http://alloy:4317).
