requires: ">=0.6.5"
repository: ghcr.io/outernet-foundation/lbe-toolkit
project_name: livekit-tier
gateway: ${GATEWAY_PORT:?err}
platforms:
  - linux/amd64
base_images:
  UV_BASE_IMAGE: "ghcr.io/astral-sh/uv:{uv}-python3.13-trixie-slim"
  LIVEKIT_SERVER_IMAGE: "docker.io/livekit/livekit-server:v1.12.0"
  CADDY_IMAGE: "docker.io/library/caddy:2.8.4-alpine"
  ALPINE_IMAGE: "docker.io/library/alpine:3.20"
services:
  livekit:
    workloads:
      - livekit.yaml
      - livekit-token.yaml
    routes:
      - path: /livekit-token/*
        upstream: livekit-token:8000
    ports:
      - service: livekit
        published: ${LIVEKIT_SIGNALING_PORT:?err}
        target: ${LIVEKIT_SIGNALING_PORT:?err}
      - service: livekit
        published: ${LIVEKIT_RTC_PORT:?err}
        target: ${LIVEKIT_RTC_PORT:?err}
        protocol: udp
