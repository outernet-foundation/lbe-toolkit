requires: ">=0.7"
repository: ghcr.io/outernet-foundation/lbe-toolkit
project_name: livekit-tier
gateway: 8443
platforms:
  - linux/amd64
base_images:
  UV_BASE_IMAGE: "ghcr.io/astral-sh/uv:{uv}-python3.13-trixie-slim"
  LIVEKIT_SERVER_IMAGE: "docker.io/livekit/livekit-server:v1.12.0"
services:
  livekit:
    options:
      tier:
        workloads:
          - livekit.yaml
          - livekit-token.yaml
        routes:
          - path: /livekit-token/*
            upstream: livekit-token:8000
        ports:
          - service: livekit
            published: 6178
            target: 6178
          - service: livekit
            published: 5957
            target: 5957
            protocol: udp
