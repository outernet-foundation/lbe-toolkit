# The self-hosted LiveKit signaling tier: server, token sidecar, ingress.
# Published as an OCI compose bundle (`uv run publish-compose`); consumers
# include it by digest and fill the holes below from their own .env.
services:
  livekit:
    image: "${LIVEKIT_SERVER_IMAGE:?err}"
    # No host port publishes: publish-pinned targets can't carry env holes, and
    # the SDP constraint (advertised udp_port == public port) makes container
    # ports consumer topology. Consumers publish ports in their own layer and
    # fill the LIVEKIT_* knobs below; the public/livekit-port equality is theirs
    # to hold.
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?err}: ${LIVEKIT_API_SECRET:?err}"
      LIVEKIT_CONFIG: |
        port: ${LIVEKIT_SIGNALING_PORT:?err}
        rtc:
          udp_port: ${LIVEKIT_RTC_PORT:?err}
          tcp_port: 0
          use_external_ip: false
          node_ip: ${LIVEKIT_RTC_IP:?err}
          # Bind the RTC UDP mux to the container's single bridge interface.
          # Forwarders deliver RTC UDP to that one socket — rathole over the
          # compose network, or a host-level forwarder via the published port.
          # pion registers each ICE session only on the socket behind the single
          # node_ip-advertised candidate, so exactly one bound interface must
          # receive the forwarded traffic (pion/ice#541).
          interfaces:
            includes: [eth0]
        logging:
          json: true
          level: info

  livekit-token:
    image: "ghcr.io/outernet-foundation/lbe-toolkit/livekit-token:${LIVEKIT_TOKEN_SHA:?err}"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/livekit-token/health')",
        ]
      interval: 5s
      start_period: 5s
      timeout: 5s
      retries: 3
    environment:
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:?err}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:?err}"
      LIVEKIT_SERVER_URL: "ws://${LIVEKIT_SIGNALING_IP:?err}:${LIVEKIT_SIGNALING_PORT:?err}"
      DEPLOYMENT_ENVIRONMENT: "${DEPLOYMENT_ENVIRONMENT:-development}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://alloy:4317}"

  ingress:
    image: "${CADDY_IMAGE:?err}"
    # No gateway dependency here: the tier must self-validate for publish,
    # and standalone consumption has no gateway. Consumers that layer a
    # gateway behind this ingress declare the dependency in their own layer.
    depends_on:
      livekit-token:
        condition: service_started
    ports:
      - target: 8443
        published: "${GATEWAY_PORT:?err}"
        protocol: tcp
        mode: ingress
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile

configs:
  # Resolved repo-root-relative at publish; the verb inlines it as content.
  caddyfile:
    file: workloads/livekit-tier/Caddyfile
